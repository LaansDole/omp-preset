symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 2
modelRoles:
  smol: commandcode/gpt-6-luna:medium
  slow: "anthropic/claude-fable-5-1:medium,anthropic/claude-fable-5:medium"
  designer: anthropic/claude-sonnet-5-5
  advisor: anthropic/claude-sonnet-5-5
  plan: anthropic/claude-opus-4-8:max
  default: anthropic/claude-opus-5-5:medium
browser:
  headless: true
dev:
  autoqaConsent: granted
display:
  cacheMissMarker: false
  showTokenUsage: true
  hideToolActivity: false
compaction:
  idleEnabled: true
composer:
  shape: pi
task:
  agentPrewalk: {}
  agentAdvisor:
    scout: "on"
    reviewer: "on"
  agentModelOverrides:
    security-reviewer: "@slow"
    reviewer-deep: "@slow"
    pr: anthropic/claude-sonnet-5-5:xhigh
    reviewer: anthropic/claude-haiku-5-5:high
    scout: anthropic/claude-haiku-5-5:medium
    sonic: anthropic/claude-haiku-5-5:medium
    init: anthropic/claude-haiku-5-5:medium
    task: anthropic/claude-opus-5-5:medium
advisor:
  enabled: true
  immuneTurns: 8
  judgeGate: true
  syncBacklog: "1"
statusLine:
  contextLine: percentage
  rightSegments:
    - model
    - context
    - git
retry:
  fallbackChains:
    anthropic/claude-fable-5-1:
      - anthropic/claude-fable-5:xhigh
cycleOrder:
  - smol
  - default
  - slow
  - plan